<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تحفيظ القرآن الكريم</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

header {
  background: #111827;
  padding: 25px 15px;
  text-align: center;
  border-bottom: 1px solid #334155;
}

header h1 {
  margin: 0;
  color: #22c55e;
  font-size: 30px;
}

header p {
  color: #cbd5e1;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.search {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: none;
  background: #1e293b;
  color: white;
  font-size: 17px;
  margin-bottom: 20px;
}

.search::placeholder {
  color: #94a3b8;
}

#loading {
  text-align: center;
  color: #94a3b8;
  padding: 20px;
}

.surahs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
}

.surah {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 15px;
  padding: 18px;
  cursor: pointer;
  transition: 0.2s;
}

.surah:hover {
  border-color: #22c55e;
  transform: translateY(-2px);
}

.number {
  color: #22c55e;
  font-weight: bold;
  font-size: 18px;
}

.name {
  font-size: 22px;
  margin-top: 8px;
}

.english {
  color: #94a3b8;
  margin-top: 6px;
  font-size: 14px;
}

.reader {
  display: none;
}

.back {
  background: #334155;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  margin-bottom: 20px;
}

.reader h2 {
  text-align: center;
  color: #22c55e;
  font-size: 30px;
}

.audio {
  width: 100%;
  margin: 15px 0 25px;
}

.ayah {
  background: #111827;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 12px;
  font-size: 25px;
  line-height: 2.2;
}

.ayah-number {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 35px;
  height: 35px;
  background: #22c55e;
  color: #052e16;
  border-radius: 50%;
  font-size: 14px;
  font-weight: bold;
  margin-left: 10px;
}

.error {
  text-align: center;
  color: #f87171;
  padding: 30px;
}

@media (max-width: 600px) {
  .ayah {
    font-size: 21px;
  }

  header h1 {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<header>
  <h1>📖 تحفيظ القرآن الكريم</h1>
  <p>القرآن الكريم كاملاً — ١١٤ سورة</p>
</header>

<div class="container">

  <div id="home">

    <input
      id="search"
      class="search"
      type="text"
      placeholder="🔎 ابحث عن سورة..."
    >

    <div id="loading">
      جاري تحميل القرآن الكريم...
    </div>

    <div id="surahs" class="surahs"></div>

  </div>

  <div id="reader" class="reader">

    <button class="back" onclick="goBack()">
      ← العودة إلى السور
    </button>

    <h2 id="surahTitle"></h2>

    <audio id="audio" class="audio" controls></audio>

    <div id="ayahs"></div>

  </div>

</div>

<script>

const API = "https://api.alquran.cloud/v1";

let allSurahs = [];


// Load all 114 Surahs
async function loadSurahs() {

  try {

    const response = await fetch(API + "/surah");

    const data = await response.json();

    allSurahs = data.data;

    document.getElementById("loading").style.display = "none";

    displaySurahs(allSurahs);

  } catch (error) {

    document.getElementById("loading").innerHTML =
      "حدث خطأ أثناء تحميل القرآن. تأكد من اتصال الإنترنت.";

  }

}


// Display Surahs
function displaySurahs(surahs) {

  const container = document.getElementById("surahs");

  container.innerHTML = "";

  surahs.forEach(function(surah) {

    const card = document.createElement("div");

    card.className = "surah";

    card.onclick = function() {
      openSurah(surah.number);
    };

    card.innerHTML = `
      <div class="number">
        سورة ${surah.number}
      </div>

      <div class="name">
        ${surah.name}
      </div>

      <div class="english">
        ${surah.englishName}
        <br>
        ${surah.numberOfAyahs} آيات
      </div>
    `;

    container.appendChild(card);

  });

}


// Search
document.getElementById("search").addEventListener("input", function() {

  const search = this.value.toLowerCase().trim();

  const results = allSurahs.filter(function(surah) {

    return (
      surah.name.toLowerCase().includes(search) ||
      surah.englishName.toLowerCase().includes(search) ||
      String(surah.number).includes(search)
    );

  });

  displaySurahs(results);

});


// Open Surah
async function openSurah(number) {

  document.getElementById("home").style.display = "none";

  document.getElementById("reader").style.display = "block";

  window.scrollTo(0, 0);

  const surah = allSurahs.find(function(s) {
    return s.number === number;
  });

  document.getElementById("surahTitle").textContent =
    surah.name + " — " + surah.englishName;

  document.getElementById("ayahs").innerHTML =
    '<div id="loading">جاري تحميل السورة...</div>';

  try {

    const response = await fetch(
      API + "/surah/" + number + "/quran-uthmani"
    );

    const data = await response.json();

    const ayahs = data.data.ayahs;

    const ayahContainer = document.getElementById("ayahs");

    ayahContainer.innerHTML = "";

    ayahs.forEach(function(ayah) {

      const div = document.createElement("div");

      div.className = "ayah";

      div.innerHTML = `
        <span class="ayah-number">
          ${ayah.numberInSurah}
        </span>
        ${ayah.text}
      `;

      ayahContainer.appendChild(div);

    });


    // Audio
    document.getElementById("audio").src =
      "https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/" +
      number +
      ".mp3";

  } catch (error) {

    document.getElementById("ayahs").innerHTML =
      '<div class="error">تعذر تحميل السورة. تحقق من اتصال الإنترنت.</div>';

  }

}


// Go back
function goBack() {

  document.getElementById("reader").style.display = "none";

  document.getElementById("home").style.display = "block";

  document.getElementById("audio").pause();

  window.scrollTo(0, 0);

}


// Start
loadSurahs();

</script>

</body>
</html>
